[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "deltax"
version = "0.1.0"
description = "Tipsport prematch odds drop monitor with Telegram alerts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cloudscraper25>=2.7.0",
    "fake-useragent>=2.0.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "user-agents>=2.2.0",
]

[project.scripts]
deltax-monitor = "deltax.monitor:main"
deltax-settle = "deltax.settle.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
